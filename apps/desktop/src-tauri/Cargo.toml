[package]
name = "dmc-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.1.1", features = [] }
tauri-plugin-updater = "2.10.1"
tokio = { version = "1.42.0", features = ["sync", "time"] }
url = "2.5.7"
