[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmc-sidecar"
version = "0.1.0"
description = "Python sidecar for DMC Assistant desktop automation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "rapidfuzz>=3.9,<4",
  "playwright>=1.52,<2",
  "cryptography>=46,<47"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pyinstaller>=6.11,<7"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dmc_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dmc_sidecar"]
