name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure isolated test paths
        shell: pwsh
        run: |
          "DMC_DATA_DIR=$env:RUNNER_TEMP\dmc-ci-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PLAYWRIGHT_BROWSERS_PATH=$env:RUNNER_TEMP\dmc-playwright" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sidecar test dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e .\apps\sidecar[dev]

      - name: Install Chromium and headless shell for localhost integration tests
        run: .\.venv\Scripts\python -m playwright install chromium

      - name: Verify desktop, native, sidecar, and release readiness
        run: pnpm run ci:verify
