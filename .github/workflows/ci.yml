name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cloud and sidecar test dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip
          .\.venv\Scripts\python -m pip install -e .\apps\cloud[dev] -e .\apps\sidecar[dev]

      - name: Desktop TypeScript
        run: pnpm run desktop:typecheck

      - name: Desktop Web Build
        run: pnpm run desktop:build

      - name: Desktop Cargo Check
        run: pnpm run desktop:cargo-check

      - name: Sidecar Typecheck
        run: pnpm run sidecar:typecheck

      - name: Sidecar Tests
        run: pnpm run sidecar:test

      - name: Cloud Tests
        run: pnpm run cloud:test
